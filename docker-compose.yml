services:
  webde-mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"

  # Eigener Caddy nur, wenn auf dem Server noch kein Reverse-Proxy auf 80/443 läuft:
  #   docker compose --profile caddy up -d
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - webde-mcp

volumes:
  caddy_data:
